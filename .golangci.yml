version: "2"

# Every linter is on, except the ones below. The golangci-lint version is pinned
# in CI (.github/workflows/_ci.yml): a new release adds linters, bump it on purpose.

linters:
  default: all

  disable:
    # Style only, no bug found: formatting is gofumpt's job (see formatters).
    - wsl # deprecated, replaced by wsl_v5
    - wsl_v5
    - funcorder
    - varnamelen
    - nonamedreturns
    - noinlineerr # forbids `if err := f(); err != nil`, the idiomatic form
    - embeddedstructfieldcheck
    - mnd
    - ireturn
    - gosmopolitan
    # Against Go idioms or this project's design.
    - exhaustruct # zero values are meaningful (cobra.Command, oauth2.Token…)
    - gochecknoglobals # cobra commands are package globals
    - gochecknoinits # cobra wires its tree in init()
    - forbidigo # a CLI prints to stdout
    - tagliatelle # JSON tags follow the backend API
    - testpackage # white-box tests use internal seams (SeedSession, Options.List…)
    - paralleltest # tests share viper's global state (resetViper, isolateConfig)
    - depguard # dependency rules are enforced by TestDependencyRule
    - wrapcheck # %w wrapping is enforced where it matters (exit codes 77/78)
    - err113 # dynamic errors are fine for user-facing messages
    - contextcheck # false positives on *Locked helpers that must not take a context
    # One complexity metric is enough: cyclop.
    - gocyclo
    - gocognit

  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      enable-default-rules: true
      rules:
        # cobra's RunE(cmd, args) signature: unused parameters are the norm.
        - name: unused-parameter
          disabled: true
    tagalign:
      align: false
      sort: true
      order:
        - description
        - json
        - toml
        - yaml
        - yml
        - label
        - label-slice-as-struct
        - file
        - kv
        - export

  exclusions:
    rules:
      # Tests are long, table-driven and repeat literals on purpose.
      - path: '_test\.go$'
        linters:
          - cyclop
          - funlen
          - nestif
          - goconst

      - path: '_test\.go$'
        text: '( always receives | is always nil| is unused)'
        linters:
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/retyc/retyc-cli

issues:
  fix: false # `make lint-fix` runs golangci-lint with --fix
