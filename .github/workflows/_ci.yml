name: _CI

on:
  workflow_call:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    # The tests of the shared metadata cache (redisstore, and vfs over it) need
    # a real Redis. They skip without REDISSTORE_TEST_URL and fail here (CI is
    # set). Each test works under a random key prefix it removes.
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          # The action keys its cache without the Go version: after a Go
          # upgrade it served stale analysis facts (false SA5011). A cold
          # lint takes a few seconds; the Go build cache of setup-go stays.
          skip-cache: true

      # The tests of internal/retycfs mount a FUSE filesystem. They skip on a
      # machine without FUSE and fail here (CI is set): the runner has
      # /dev/fuse, the fusermount3 helper is not guaranteed.
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Test
        env:
          REDISSTORE_TEST_URL: redis://localhost:6379/15
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Run directly rather than through govulncheck-action: the action sets
      # up a second toolchain ("stable", not the one from go.mod) with its own
      # module and build cache, and checks the repository out again.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build (dev)
        run: CGO_ENABLED=0 go build ./...

      - name: Build (prod)
        run: CGO_ENABLED=0 go build -tags prod ./...

  # Builds the release artifacts as a snapshot, so that a broken goreleaser
  # config or Debian package fails here rather than on the release tag.
  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Lintian
        run: |
          sudo apt-get update && sudo apt-get install -y lintian
          lintian --fail-on error,warning dist/*.deb

      - name: Install test (deb)
        run: |
          sudo apt-get install -y ./dist/retyc_*_amd64.deb
          retyc version
          test -f /usr/share/bash-completion/completions/retyc

      - name: Install test (rpm)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:42 sh -c '
            dnf install -y /dist/retyc-*.x86_64.rpm &&
            retyc version &&
            test -f /usr/share/zsh/site-functions/_retyc'
