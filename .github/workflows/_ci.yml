name: _CI

on:
  workflow_call:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Run directly rather than through govulncheck-action: the action sets
      # up a second toolchain ("stable", not the one from go.mod) with its own
      # module and build cache, and checks the repository out again.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build (dev)
        run: CGO_ENABLED=0 go build ./...

      - name: Build (prod)
        run: CGO_ENABLED=0 go build -tags prod ./...
