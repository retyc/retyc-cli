name: _Docker

on:
  workflow_call:
    inputs:
      push:
        description: "Push the image; false only builds it (branches, pull requests)"
        required: false
        type: boolean
        default: true

jobs:
  docker:
    name: ${{ inputs.push && 'Push image' || 'Build image' }}
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: `git describe` below needs them.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No QEMU: the Dockerfile cross-compiles from the build platform and the
      # final stage only copies files, so nothing runs under the target arch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The registries are only needed to push; a build-only run must also work
      # where the secrets are not available (pull request from a fork).
      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push && github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags follow from the event, never from the caller:
      #   push of a v1.2.3 tag      -> v1.2.3 + latest
      #   push of a v1.2.3-rc1 tag  -> v1.2.3-rc1 only (a pre-release never moves latest)
      #   push to the default branch -> its name (master)
      #   manual run, any ref       -> commit-<short sha>, GHCR only: a one-off
      #                                build never moves a release or branch tag
      #   anything else             -> no tag (build only)
      - name: Image tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/retyc/retyc-cli
            name=retyc/retyc-cli,enable=${{ github.event_name != 'workflow_dispatch' }}
          tags: |
            type=semver,pattern={{raw}},enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=sha,prefix=commit-,enable=${{ github.event_name == 'workflow_dispatch' }}

      # OCI `created` is the image build date; computed here rather than taken
      # from the event payload, which lacks head_commit for some pushes (e.g.
      # annotated tags) and would leave the label empty.
      # The version compiled into the binary is not the image tag: the API
      # refuses a CLI whose version it cannot read, so an untagged build gets
      # the same `git describe` version as `make build` (v1.2.3-4-gabc1234).
      # A tag push uses the pushed tag itself, which `git describe` could not
      # tell from another tag on the same commit.
      - name: Image version and build date
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          provenance: ${{ inputs.push && 'mode=max,version=v1' || 'false' }}
          sbom: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

  # Dev build (no `prod` tag: dev API default, `--insecure`), amd64 only, GHCR only.
  # Same events as above, with the images named retyc-cli-dev; never a release tag.
  docker-dev:
    name: ${{ inputs.push && 'Push dev image' || 'Build dev image' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #   push to the default branch -> its name (master)
      #   manual run, any ref       -> commit-<short sha>
      - name: Image tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/retyc/retyc-cli-dev
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=sha,prefix=commit-,enable=${{ github.event_name == 'workflow_dispatch' }}

      # `git describe` version, as in the job above: the API refuses `dev` (426).
      - name: Image version and build date
        id: meta
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TAGS=
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
