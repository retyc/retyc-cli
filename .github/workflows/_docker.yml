name: _Docker

on:
  workflow_call:
    inputs:
      tags:
        description: "Newline-separated list of image tags"
        required: true
        type: string
      version:
        description: "Version string passed as Docker build-arg"
        required: true
        type: string

jobs:
  docker:
    name: Push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # OCI `created` is the image build date; computed here rather than taken
      # from the event payload, which lacks head_commit for some pushes (e.g.
      # annotated tags) and would leave the label empty.
      - name: Image build date
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max,version=v1
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ inputs.tags }}
          build-args: VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
