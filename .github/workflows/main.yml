name: CI

on:
  push:
    branches: ['**']
    paths: &code_paths
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.goreleaser.yaml'
      - 'scripts/completions.sh'
      - '.github/workflows/main.yml'
      - '.github/workflows/_ci.yml'
      - '.github/workflows/_docker.yml'
  pull_request:
    paths: *code_paths

jobs:
  ci:
    name: CI
    # A branch of this repository is tested by its push; the pull_request run
    # is only for forks, which have no push run here. Without this, every push
    # to a branch with an open pull request runs the workflow twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/_ci.yml

  # Builds the image everywhere, pushes it (as `master`) from the default branch
  # only. `latest` belongs to the release workflow.
  docker:
    name: Docker
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker.yml
    with:
      push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    secrets: inherit
