name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_ci.yml

  docker:
    name: Docker
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_docker.yml
    with:
      tags: |
        ghcr.io/retyc/retyc-cli:${{ github.ref_name }}
        ghcr.io/retyc/retyc-cli:latest
        retyc/retyc-cli:${{ github.ref_name }}
        retyc/retyc-cli:latest
      version: ${{ github.ref_name }}
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails if the manifest version (injected from the build version, which
      # goreleaser derives from the tag) does not match the tag itself.
      - name: Build MCPB bundle
        run: scripts/build-mcpb.sh --expect-version "${GITHUB_REF_NAME#v}"

      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2 validate dist/mcpb/manifest.json

      - name: Upload MCPB bundle to release
        run: gh release upload "${GITHUB_REF_NAME}" dist/retyc-*.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
