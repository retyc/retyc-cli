name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_ci.yml

  docker:
    name: Docker
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_docker.yml
    secrets: inherit

  package:
    name: Package
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml

  goreleaser:
    name: GoReleaser
    needs: [ci, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signature

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Used by goreleaser (`signs:`) and to sign the MCPB bundle below.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails if the manifest version (injected from the build version, which
      # goreleaser derives from the tag) does not match the tag itself.
      - name: Build MCPB bundle
        run: scripts/build-mcpb.sh --expect-version "${GITHUB_REF_NAME#v}"

      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2 validate dist/mcpb/manifest.json

      - name: Sign MCPB bundle
        run: |
          for f in dist/retyc-*.mcpb; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Upload MCPB bundle to release
        run: gh release upload "${GITHUB_REF_NAME}" dist/retyc-*.mcpb dist/retyc-*.mcpb.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
